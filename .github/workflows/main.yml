name: CI

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install zig, cargo-zigbuild, and just
        run: |
          brew install zig just
          cargo install cargo-zigbuild

      - name: Build
        run: just build

      - name: Check all targets
        run: cargo check --all-targets

      - name: Run unit tests
        run: cargo test

      - name: Probe
        if: always()
        run: |
          sysctl -n machdep.cpu.brand_string hw.model kern.hv_support || true
          sysctl -a | grep -i -E 'hv_|vmm' | head -20 || true
          sw_vers
          file target/release/bcvk target/nbd-server/bcvk-nbd || true
          ./target/release/bcvk --help
          ./target/release/bcvk ephemeral --help
          ./target/release/bcvk vm --help
          brew install vfkit || true
          vfkit --version || true
          perl -e "alarm 30; exec @ARGV" vfkit --cpus 1 --memory 512 --bootloader efi,variable-store=$RUNNER_TEMP/efi-vars,create --device virtio-rng > $RUNNER_TEMP/vfkit.log 2>&1 || echo "vfkit exited with $?"
          cat $RUNNER_TEMP/vfkit.log
